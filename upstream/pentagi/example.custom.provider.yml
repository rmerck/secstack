# Cloud hybrid template (inert until LLM_SERVER_URL / LLM_SERVER_KEY are set in .env).
# Heavy reasoning roles -> frontier model; high-volume roles -> cheap fast model on the same endpoint.
# Replace model IDs with ones your endpoint serves (e.g. an OpenRouter or Anthropic-compatible gateway).
adviser:
  model: "FRONTIER_MODEL_ID"
  n: 1
  max_tokens: 16000

