# Self-hosted SearXNG for pentagi (reachable only on the pentagi-network as http://searxng:8080).
use_default_settings: true
general:
  instance_name: "secops-searxng"
  enable_metrics: false
server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 0
  formats: [html, json]
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
